# ─────────────────────────────────────────────────────────────
#  MRU Alt-Tab for Hyprland — switches WORKSPACES by recency
#  Add to hyprland.conf:   source = mru/alt-tab.conf
# ─────────────────────────────────────────────────────────────

# ── Edit these ───────────────────────────────────────────────
$mruMod     = SUPER          # modifier you hold while switching
$mruRelease = Super_L        # release keysym of $mruMod:
                             #   ALT -> Alt_L   SUPER -> Super_L   CTRL -> Control_L
$mruKey     = Tab            # key that steps through workspaces
$mruDir     = ~/.config/hypr/mru
# ─────────────────────────────────────────────────────────────

# Keep a recency history of workspaces (Hyprland doesn't expose one).
exec-once = $mruDir/mru-ws-daemon.sh

# First press: step once, then enter a capture submap so we can reliably
# catch the moment you RELEASE the modifier. (Hyprland doesn't deliver a
# release event for a bare modifier at the root map, but it does inside a
# submap — that's why the switch runs in one.)
bind = $mruMod,       $mruKey, exec, $mruDir/mru-ws-switch.sh next
bind = $mruMod,       $mruKey, submap, mru_alttab

submap = mru_alttab
# Keep cycling while the modifier stays held.
bind = $mruMod,       $mruKey, exec, $mruDir/mru-ws-switch.sh next
bind = $mruMod SHIFT, $mruKey, exec, $mruDir/mru-ws-switch.sh prev

# Modifier released → commit the choice. The commit script also leaves the
# submap (`hyprctl dispatch submap reset`), because only ONE bind per key
# fires, so we can't use a separate `submap, reset` line here.
# NOTE: the mask must include $mruMod — at release time its bit is still
# set for this event, so `bindrt = , Alt_L` would NOT match.
bindrt = $mruMod, $mruRelease, exec, $mruDir/mru-ws-switch.sh commit

# Safety hatch: Escape also commits + leaves, so a missed release can never
# trap the keyboard in the submap.
bind = , escape, exec, $mruDir/mru-ws-switch.sh commit
submap = reset
